  # Canada.ca explicitly offers these public RSS/Atom feeds. Each broad government
  # feed is filtered before persistence so unrelated Canadian news is never tagged
  # as Temu intelligence.
  - source_id: canada-health-product-recalls-temu
    name: Health Canada Consumer Product Recalls mentioning Temu
    entry_url: https://recalls-rappels.canada.ca/en/feed/consumer-products-alerts-recalls
    platforms: [temu]
    trust_tier: official
    collector: rss
    content_scope: full_text
    attribution: Government of Canada / Health Canada
    publisher_key: canada.ca
    compliance: pending_review
    enabled: false
    regions: [ca]
    language_hint: en
    interval_minutes: 360
    terms_url: https://open.canada.ca/en/open-government-licence-canada
    robots_url: https://recalls-rappels.canada.ca/robots.txt
    reviewed_at: 2026-08-11
    compliance_notes: Health Canada explicitly publishes a consumer-product recall RSS feed and the Government of Canada Open Government Licence permits reuse with attribution. Robots does not disallow the feed or recall detail paths. The 2026-08-11 live smoke returned HTTP 403 on the ingestion client's proxy-free connection while a system-proxy request returned 200; the source remains disabled rather than weakening DNS pinning or proxy isolation.
    collector_config:
      item_limit: 25
      detail_match_terms: temu|whaleco

