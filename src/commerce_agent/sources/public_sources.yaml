version: 1
sources:
  # Amazon candidates remain disabled until Amazon confirms automated reuse terms.
  - &amazon
    source_id: amazon-seller-blog
    name: Amazon Selling Partner Blog
    entry_url: https://sell.amazon.com/blog/
    platforms: [amazon]
    trust_tier: official
    collector: html
    compliance: pending_review
    enabled: false
    regions: [global]
    language_hint: en
    interval_minutes: 120
    terms_url: https://www.amazon.com/gp/help/customer/display.html?nodeId=508088
    robots_url: https://sell.amazon.com/robots.txt
    reviewed_at: 2026-07-20
    compliance_notes: Public official page confirmed; automated reuse permission was not confirmed.
    collector_config: &html_config
      link_selector: "article a"
      article_selector: article
      item_limit: 50

  - <<: *amazon
    source_id: amazon-seller-announcements
    name: Amazon Seller Announcements
    entry_url: https://sell.amazon.com/blog/announcements

  - <<: *amazon
    source_id: amazon-seller-forums
    name: Amazon Seller Forums
    entry_url: https://sellercentral.amazon.com/seller-forums
    robots_url: https://sellercentral.amazon.com/robots.txt
    compliance_notes: Public forum entry retained for review; login boundaries must not be crossed.

