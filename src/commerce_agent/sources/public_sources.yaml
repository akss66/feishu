  # GDELT is a metadata-only discovery layer. One bounded query is kept per platform.
  - &gdelt
    source_id: media-gdelt-amazon
    name: GDELT Amazon Discovery
    entry_url: "https://api.gdeltproject.org/api/v2/doc/doc?query=%28%22Amazon%20marketplace%22%20OR%20%22Amazon%20seller%22%29%20%28policy%20OR%20compliance%20OR%20regulation%20OR%20recall%20OR%20lawsuit%20OR%20tariff%20OR%20seller%29&mode=artlist&format=json&maxrecords=25&timespan=1d&sort=datedesc"
    platforms: [amazon]
    trust_tier: media
    adapter: gdelt
    content_scope: metadata_only
    attribution: GDELT index; original publisher shown per item
    collector: api
    compliance: allowed
    enabled: true
    regions: [global]
    language_hint: en
    interval_minutes: 120
    terms_url: https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
    robots_url: https://api.gdeltproject.org/robots.txt
    reviewed_at: 2026-07-27
    compliance_notes: Enabled as a metadata-only discovery source using one bounded GDELT DOC 2.0 ArtList request for Amazon per run. Results must match the reviewed publisher catalog; unknown and denied publishers are discarded. Original article fetching remains independently disabled until controlled smoke passes; HTTP 429 is never bypassed.
    collector_config:
      items_path: $.articles
      url_field: $.url
      title_field: $.title
