    language_hint: en
    interval_minutes: 360
    terms_url: https://open.canada.ca/en/open-government-licence-canada
    robots_url: https://www.canada.ca/robots.txt
    reviewed_at: 2026-08-11
    compliance_notes: The Canada News Centre explicitly lists this organization-specific Atom feed for subscription. Government news content is reused under the Open Government Licence with attribution; only feed entries whose title, summary, author, or URL contains Temu, Whaleco, or PDD Holdings are retained.
