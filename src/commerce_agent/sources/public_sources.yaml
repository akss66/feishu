  # Amazon explicitly publishes this SP-API changelog as an RSS subscription.
  - source_id: amazon-sp-api-changelog-rss
    name: Amazon SP-API Changelog RSS
    entry_url: https://developer-docs.amazon/sp-api/changelog.rss
    platforms: [amazon]
    trust_tier: official
    collector: rss
    content_scope: feed_summary
    attribution: Amazon
    publisher_key: amazon.com
    compliance: allowed
    enabled: true
    regions: [global]
    language_hint: en
    interval_minutes: 120
    terms_url: https://developer-docs.amazon/sp-api/changelog/october-2022-sp-api-release-announcement
    robots_url: https://developer-docs.amazon/robots.txt
    reviewed_at: 2026-07-22
    compliance_notes: Amazon's official October 2022 SP-API announcement explicitly provides the changelog RSS subscription; initially disabled pending a local live smoke test.
    collector_config:
      item_limit: 50

