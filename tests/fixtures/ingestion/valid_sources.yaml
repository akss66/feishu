version: 1
sources:
  - source_id: zeta-html
    name: Zeta public announcements
    entry_url: https://news.example.com/announcements
    platforms: [amazon]
    trust_tier: official
    collector: html
    content_scope: full_text
    attribution: Zeta
    publisher_key: news.example.com
    compliance: allowed
    enabled: true
    regions: [global]
    language_hint: en
    interval_minutes: 120
    terms_url: https://news.example.com/terms
    robots_url: https://news.example.com/robots.txt
    reviewed_at: 2026-07-20
    compliance_notes: Public announcements reviewed for automated collection.
    collector_config:
      link_selector: "article a"
      article_selector: article
      item_limit: 50

  - source_id: alpha-api
    name: Alpha public updates API
    entry_url: https://api.example.com/v1/updates
    platforms: [ebay, temu]
    trust_tier: media
    adapter: generic
    content_scope: metadata_only
    attribution: Alpha News
    publisher_key: alpha.example
    collector: api
    compliance: allowed
    enabled: true
    regions: [us, eu]
    language_hint: en
    interval_minutes: 240
    terms_url: https://api.example.com/terms
    robots_url: https://api.example.com/robots.txt
    reviewed_at: 2026-07-20
    compliance_notes: Publisher documents this endpoint for public unauthenticated use.
    collector_config:
      items_path: data.items
      url_field: url

  - source_id: middle-feed
    name: Middle pending feed
    entry_url: https://feeds.example.com/news.xml
    platforms: [shopee]
    trust_tier: official
    collector: rss
    compliance: pending_review
    enabled: false
    regions: [sg]
    language_hint: en
    interval_minutes: 120
    terms_url: https://feeds.example.com/terms
    robots_url: https://feeds.example.com/robots.txt
    reviewed_at: 2026-07-20
    compliance_notes: Candidate retained while regional terms are reviewed.
    collector_config:
      item_limit: 25
